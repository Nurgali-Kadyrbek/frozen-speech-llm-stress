  reason: |
    L_BLSP gradient dominates structural-term gradients by 5–370× across
    400 training steps; combined with grad clipping at max_norm=1.0 the
    structural terms (L_cf, L_cond-pred, L_NCE-cond) make ≪ 1% contribution
    to each optimizer update. L_NCE-cond final value 0.699 ≈ uniform log 2
    despite cos-sim-non-degenerate word-substitution embeddings. The B1
    mechanism is correctly wired (cos-sim 0.641 ≪ 0.85 gate; T-only 0.16
    ≪ 0.30; L_artifact trigger rate 6.88% > 5% kickoff criterion) — the
    failure is the loss-weight schedule, not the loss design.
