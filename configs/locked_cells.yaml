      t_only_eval_acc: 0.1603       # < 0.30 contamination floor
      l_nce_final:     0.699        # uniform = log 2 = 0.693
      l_nce_below_uniform: false    # NOT meeting REVISED-HEADLINE criterion (< 0.6)
