# Locked stack after Stage 1 (Probe-G-oracle + WavLM Probe-K + Whisper diagnostic).
# Locking date: 2026-05-02 (Stage 1, single session).
# Selection rule: highest LINEAR Probe-K on Stress-17K-raw probe-eval
# (held-out transcripts, deterministic 80/20 split). StressPresso is held out
# from selection by the governing rule and reported only.

llm:
  id: "Qwen/Qwen3-8B"
  d_llm: 4096
  dtype_for_training: "bfloat16"   # provisional; fp32 used for Stage 1a oracle.
  selection_rationale: |
    Qwen3-1.7B oracle accuracy = 0.7228 (CI margin > 0 but accuracy < 0.75 → switch).
    Qwen3-8B oracle accuracy   = 0.7871 (CI margin > 0; passes the 0.75 floor,
    borderline against the 0.80 ideal). Locking 8B; re-check on a stronger LLM
    before claiming any headline result is required by the session prompt.
  oracle_threshold_status: "PASS_BORDERLINE"
  flagged_for_recheck_at_scale: true

speech_encoder:
  id: "microsoft/wavlm-large"
  d_enc: 1024
  cell: "WavLM-L16"
  cell_mode: "single"
  cell_layers: [16]
  selection_rationale: |
    Top LINEAR Probe-K on Stress-17K-raw probe-eval (held-out-transcript):
    WavLM-L16=0.4239, WS{8..16}=0.4158, WS{1..24}=0.4088, L12=0.4088, L8=0.3449.
    L16 wins by a small margin over WS{8..16}; both are robust to fp16 cast and
    additive Gaussian σ ≤ 0.1 (Δ ≤ 0.01).
  notes_for_stage_2_plus: |
    Adapter input = WavLM hidden_states[16] at 50 Hz, then 4× strided 1D conv
    + 2-layer MLP + RMSNorm + modality-token. Adapter last-linear init scale
    should target measured row-norm ‖embed_tokens(8B)‖₂ (re-measure for 8B,
    NOT the 1.7B value reported in the Stage-0 session notes). The 1.7B value
    (‖row‖≈1.539) used a different d_llm.

diagnostic_appendix:
  whisper_layers_kept: [22, 32]
  qwen3_asr: "deferred (Stage 0 spike)"
  notes: |
    Whisper-L32 LINEAR Probe-K (0.440) is comparable to WavLM-L16 (0.424) and
    higher than Whisper-L22 (0.233). The expected STT-bottleneck pattern
    (WavLM > Whisper-22 > Whisper-32 ≈ K_T) is NOT observed; design §1's
    narrative needs an empirical update. Whisper-L22 < K_T (0.290) is also
    surprising and is documented as a flag.

splits:
  stress17k_raw:
    partition_seed: "BTA-2026-05-02"
    eval_frac: 0.20
    train_transcription_ids: 822
    eval_transcription_ids:  197
    train_rows: 3629
    eval_rows:  861
    n_max_classes: 13
    multi_stress_filtered: 1221  # Stress-17K records with len(gt_stress_indices) != 1 dropped.
  stresspresso:
    role: "held-out report only (NOT used for selection)"
    n_items: 202


# ---- Stage 2 R0 BLSP baseline (appended; does NOT overwrite Stage-1 cells) ---- #
# Run date: 2026-05-02. 5 seeds: 1234 (600 steps) + 1235-1238 (300 steps each;
# loss had plateaued by step 250 in seed 1234). Effective batch=32 via
# microbatch=1 + grad-accum=32. AdamW lr=5e-5, cosine to 1e-6.
stage2_r0_baseline:
  adapter:
    architecture: "Conv1d(1024→4096, k=4, s=4) → MLP-2(4096→8192→4096, GeLU, residual after layer 1) → RMSNorm → +modality_token"
    trainable_params_M: 83.91
    deviation_note: "exceeds kickoff §2.0 ≤60M soft target by 40%; arithmetic consequence of MLP hidden = 2·d_llm = 8192 with d_llm=4096"
    init_calibration:
      std_8b_measured: 0.02205
      embed_row_norm_mean: 1.3758
      last_linear_std: 0.000345     # std_8b / sqrt(d_llm)
      rmsnorm_scale: 0.02149        # post-smoke retune to bring ‖A(H)‖/‖row‖ into [0.5,2.0]
      modality_token_std: 0.02205
  training:
    seeds: [1234, 1235, 1236, 1237, 1238]
    optimizer: "AdamW lr=5e-5 weight_decay=0.01"
    schedule: "warmup-then-cosine (warmup=500 for seed 1234; warmup=250 for seeds 1235-1238)"
    grad_clip_max_norm: 1.0
    data_mix: "60% Stress-17K probe-train (3629 rows) + 20% LibriSpeech-clean-100 (6000 sampled) + 20% Expresso-read (5799 read-split)"
    augmentation: "bandlimit + synthetic-reverb + additive-noise + mu-law + resample-jitter (MP3/Opus codecs deferred — no ffmpeg dep)"
    precision: "Qwen3-8B + WavLM bf16 frozen; adapter fp32 trainable; loss/optim fp32"
  results_5seed:
    probe_g_neutral_accuracy:
      mean: 0.5122
      sigma: 0.0108
      range: 0.0262
    probe_g_total_accuracy:
      mean: 0.6306
      sigma: 0.0095
      range: 0.0265
    probe_g_signed_margin_total:
      mean: 2.135
      sigma: 0.225
      range: 0.565
    probe_k_linear_eval_full:
      mean: 0.2105
      sigma: 0.0128
      range: 0.0314
    probe_k_mlp2_eval_full:
      mean: 0.2446
      sigma: 0.0339
      range: 0.0859
    cascade_t_neutral_accuracy: 0.5069  # deterministic across seeds
    k_t_baseline_neutral_accuracy: 0.5064  # deterministic
    oracle_reconfirm_accuracy: 0.7871  # delta from Stage 1a = +0.00 pp every seed
  outcome_mapping:
    expected: true
    sub_cascade_collapse: true
    sub_cascade_collapse_definition: "Probe-K(A_BLSP) linear eval_full < Probe-K(K_T) for ALL 5 seeds; mean Δ vs K_T = -0.080"
    delta_seeds: "narrow (UNEXPECTED-D / §11 F1) — BLSP fixed-point is empirically tight"
    floor_for_stage_3: |
      R1 structural adapter must clear BOTH:
       (a) Probe-G(A_R1)_neutral > 0.51 + cascade-T (i.e., > 0.557 with non-overlapping CIs)
       (b) Probe-K(A_R1) linear eval_full > K_T (0.290), NOT just > A_BLSP (0.211).
      Symmetry constraint: 5 seeds for R1 to match this R0 cohort (Codex round-3).


