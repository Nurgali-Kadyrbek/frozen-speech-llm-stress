# ---- Stage 3.7 R1 loss-weight rebalance pilot (REVISED-PIPELINE-BUG-PERSISTS) ---- #
# Run date: 2026-05-02. Single seed (1234). Cohort skipped per kickoff
# §3.7.4 conclusion ("If REVISED-PIPELINE-BUG-PERSISTS fires, stop and report").
stage3p7_r1_pilot:
  branch: "REVISED-PIPELINE-BUG-PERSISTS"
  reason: |
    S1 fails: L_NCE final 0.695 ≈ uniform log 2 = 0.693 despite λ_NCE = 3
    (12× the Stage 3.6 hedge). Codex cos-contrib diagnostic identifies
    root cause: L_NCE gradient direction is approximately ORTHOGONAL to
    the L_BLSP + L_cf direction (mean cos 0.05-0.16 across training).
    Cosine alignment is scale-invariant under uniform clipping, so λ
    tuning cannot resolve the conflict — only per-component projection
    (PCGrad / GradVac) or per-component normalized aggregation can route
    the small dimension-orthogonal signal into the actual update direction.
    This is a Stage 3.8 protocol design issue, not a Stage 3.7 λ search
    issue. Notable secondary finding: λ_cf = 5 produced the first
    measurable Probe-K progress in any R1 cell.
  one_axis_change_from_stage3p6:
    lambda_kl:        1.0    # unchanged
    lambda_cf:        5.0    # changed: 1.0 → 5.0 (5×)
    lambda_artifact:  1.0    # unchanged
    lambda_cond:      0.5    # unchanged
    lambda_nce:       3.0    # changed: 0.25 (3.6 hedge) → 3.0 (12×)
  s_criteria:
    s1_l_nce_below_0_65:                              false   # 0.695
    s2_probe_k_linear_in_domain_above_desc_only_floor: false   # 0.227 < 0.361
    s3_c2_cross_domain_revised_PASS:                   "partial — only ratio condition (0.831 ≥ 0.80) met"
    s4_probe_g_neutral_above_R0:                       true    # 0.515 ≥ 0.512
  results_pilot:
    probe_g_neutral_accuracy:   0.5153
    probe_g_total_accuracy:     0.6319
    probe_g_explicit_accuracy:  0.7485
    probe_k_linear_eval_full:   0.2265   # +0.0160 vs R0 cohort 0.211 — FIRST CROSSING
    probe_k_linear_within:      0.6213
    probe_k_linear_sp_full:     0.1881
    probe_k_mlp2_eval_full:     0.3120   # +0.0674 vs R0 — CLEARS K_T 0.290
    probe_k_mlp2_within:        0.7212
    probe_k_mlp2_sp_full:       0.2079
    cascade_t_neutral_accuracy: 0.5069
    k_t_baseline_neutral_accuracy: 0.5064
    oracle_reconfirm_accuracy:  0.7871
  branch_d_diagnostics:
    c1_within_domain_PASS:                  true    # PASSED first time
    c1_subset_accs:                         {nova: 0.2394, echo: 0.2138, stresspresso: 0.1881}
    c2_cross_domain_transfer_revised_PASS:  false
    c2_in_domain_acc:                       0.2265
    c2_cross_domain_acc:                    0.1881
    c2_ratio:                               0.8307  # passes ratio condition for first time
    c2_desc_only_floor:                     0.3612
    c2_cond_i_cross_above_floor_005:        false   # 0.188 < 0.411
    c2_cond_ii_ratio_above_080:             true    # 0.83 ≥ 0.80 — first time
    c2_cond_iii_in_above_floor_010:         false   # 0.227 < 0.461
    c3_domain_stratified_probe_g_PASS:      false
    c3_fraction_uplift_positive:            0.50
    c4_domain_acc_A_R1p7:                   0.7625
    c4_RED_FLAG:                            false
    b3_style_probe_eval_acc:                0.4250  # case i_encodes_style, more pronounced than 3.6
    t_only_eval_acc:                        0.1603
  per_component_grad_diagnostics:
    main_step_clip_rate:        1.00      # 400/400; total grad always > 1.0
    artifact_trigger_rate:      0.0575    # 46/800; meets > 5%
    cos_to_total_update:
      L_cf:        "0.95-1.00 (highly aligned — λ=5 worked)"
      L_NCE_cond:  "0.05-0.16 (essentially orthogonal — λ tuning cannot fix)"
      L_cond_pred: "-0.02 to 0.01 (orthogonal noise; pool-grad ~0.4 absolute)"
      L_task:      "0.34-0.70 (composite alignment varies)"
      L_KL:        "-0.37 to 0.62 (occasionally adversarial to total)"
  notable_progress:
    - "Probe-K linear eval_full ABOVE R0 cohort mean for the first time (0.226 > 0.211)"
    - "Probe-K mlp2 eval_full clears K_T floor for the first time (0.312 > 0.290)"
    - "Probe-K mlp2 within-transcript +5pp vs Stage 3.6 (0.672 → 0.721)"
    - "C.1 within-domain stratified PASSES for the first time (all subsets > chance+10pp)"
    - "C.2 ratio condition PASSES for the first time (0.83 ≥ 0.80)"
  recommended_stage_3p8:
    option_a_pcgrad_gradient_projection:
      description: "Project ∇L_NCE onto null space of ∇L_cf when cos < 0"
      cost:        "minor — 1 extra autograd.grad per backward"
    option_b_per_component_adamw:
