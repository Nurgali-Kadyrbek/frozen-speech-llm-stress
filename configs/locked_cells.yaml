    probe_g_total_accuracy:    0.6450
    probe_g_signed_margin_total: 2.1176
    probe_k_linear_eval_full:  0.1998
    probe_k_linear_within:     0.6156
    probe_k_linear_sp_full:    0.1436
    probe_k_mlp2_eval_full:    0.2590
    probe_k_mlp2_sp_full:      0.1535
    cascade_t_neutral_accuracy: 0.5069
    k_t_baseline_neutral_accuracy: 0.5064
    oracle_reconfirm_accuracy: 0.7871
  branch_d_diagnostics:
    c1_within_domain_PASS:                 false   # sp=0.144 < chance+10pp
    c1_subset_accs:                        {nova: 0.2019, echo: 0.1977, stresspresso: 0.1436}
    c2_cross_domain_transfer_revised_PASS: false
