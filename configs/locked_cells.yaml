      cost:        "N× adapter-param-mem; complex"
    option_c_drop_l_nce_entirely:
      description: "Stage 3.8 cohort with λ_NCE=0 to test whether L_cf alone is the driver"
      cost:        "trivial — just rerun with λ_NCE=0; clearest signal"
