# ---- Stage 4 controls (CONTROLS-PASS validates R1.8 MLP-2 > K_T) ---- #
# Run date: 2026-05-02 → 03 (multi-day session). Three falsification
# controls run against the Stage 3.8 R1.8 cohort.
stage4_controls:
  branch: "CONTROLS-PASS"
  reason: |
    All three falsification gates clear with substantial margin:
      Control A (text-only) MLP-2 cohort = 0.2122, gap to R1.8 cohort
        (0.3059) = -0.094. Structural objective is NOT optimizer
        regularization.
      Control B (shuffled audio) MLP-2 cohort = 0.2033, gap to R1.8
        cohort = -0.103. Audio is doing real work, not transcript-side
        leakage.
      Shortcut probes per-seed PASS in 5/5 seeds; cohort tts_vs_real
        0.645 (raw H 0.89, drop -0.25), cohort domain 0.762 (raw H 0.99,
        drop -0.23). Adapter compresses nuisance signal substantially.
    R1.8 representational MLP-2 > K_T finding validated as
    audio-derived. Bounded F3 result is publishable; Stage 6 minimal-LoRA
    upper-bound is the next experiment to test whether F3 is mechanistic
    (does LoRA on Qwen3-8B q_proj/v_proj recover consumer-side use of
    the adapter's structural signal?).
  control_a_text_only:
    seeds: [1234, 1235, 1236]
    proj_P_fit:
      method:        "numpy.linalg.lstsq with bias term"
      train_samples: 500
      train_mse:     0.0899
      train_cos_sim: 0.9992
      shape:         "W: (4096, 1024), b: (1024,)"
    loss_weights: {lambda_kl: 1.0, lambda_cf: 5.0, lambda_artifact: 1.0, lambda_cond: 0.5, lambda_nce: 0.0}
    cohort_results:
      probe_k_linear_eval_full: {mean: 0.2292, sigma: 0.0094}
      probe_k_mlp2_eval_full:   {mean: 0.2122, sigma: 0.0203}
      probe_k_linear_sp_full:   {mean: 0.1304}
      probe_k_mlp2_sp_full:     {mean: 0.1502}
      probe_g_neutral:          {mean: 0.5092}
      probe_g_explicit:         {mean: 0.7622}
    pass_threshold:    0.310     # K_T floor 0.290 + 0.02
    pass_mlp2_cohort:  true
    gap_vs_R1p8_mlp2:  -0.0937
    interpretation: |
      Text-only adapter under the SAME R1.8 loss does NOT reach R1.8's
      MLP-2 representational level. L_cf at training time stays at
      uniform (~0.696) because text-projection inputs offer no
      Φ-discriminating signal — the model cannot solve cf-pair contrast
      from text alone. The structural objective genuinely requires
      audio.
  control_b_shuffle:
    seeds: [1234, 1235, 1236]
    cf_pairs_path: "outputs/stage4/cf_pairs_train_shuffled.jsonl"
    n_pairs:       3666
    decorrelation: "audio drawn from a DIFFERENT transcript per pair member; transcript+Φ labels intact"
    loss_weights: {lambda_kl: 1.0, lambda_cf: 5.0, lambda_artifact: 1.0, lambda_cond: 0.5, lambda_nce: 0.0}
    cohort_results:
      probe_k_linear_eval_full: {mean: 0.2083, sigma: 0.0159}
      probe_k_mlp2_eval_full:   {mean: 0.2033, sigma: 0.0112}
      probe_k_linear_sp_full:   {mean: 0.1485}
      probe_k_mlp2_sp_full:     {mean: 0.1601}
      probe_g_neutral:          {mean: 0.5155}
      probe_g_explicit:         {mean: 0.7685}
    pass_threshold:    0.275     # R0 cohort mlp2 0.245 + 0.030
    pass_mlp2_cohort:  true
    gap_vs_R1p8_mlp2:  -0.1026
    interpretation: |
      Shuffled-audio adapter falls BELOW R0 cohort baseline on linear
      Probe-K (0.208 vs R0 0.211) — when audio is decorrelated from
      labels, the adapter cannot encode Φ at all. R1.8's gain requires
      correct (audio, transcript, Φ) alignment.
  shortcut_probes_cohort:
    seeds_evaluated: [1234, 1235, 1236, 1237, 1238]
    raw_H_baselines:
      tts_vs_real: 0.89   # Stage 3.0.5 aggressive_aug
      domain:      0.99
    pass_threshold_drop_per_seed: 0.10
    per_seed_PASS_count: 5
    n_seeds:             5
    cohort_PASS:         true
    cohort_means:
      tts_vs_real_eval_acc: {mean: 0.6450, sigma: 0.0565}
      domain_eval_acc:      {mean: 0.7625, sigma: 0.0000}
    interpretation: |
      Adapter compresses tts_vs_real signal from raw H 0.89 → 0.65
      cohort mean (drop -0.245), domain from 0.99 → 0.76 (drop -0.228).
      All 5 seeds clear the per-seed 0.10-absolute-drop threshold.
      Combined with Stage 3.0.5 finding that raw H is encoder-construction
      shortcut-rich, this confirms the adapter is the load-bearing
      compression — not the augmentation.
  recommended_next_stage:
    - "Stage 6 minimal-LoRA upper-bound on Qwen3-8B q_proj/v_proj at ranks 4/8/16. Test: does small LoRA on the LLM recover consumer-side use of A_R1.8(H)'s structural signal? F3 mechanistic if yes; structural-but-stuck if no."
    - "Stage 5 per-term ablations are now informative: drop L_artifact, drop L_cond_pred individually to attribute which term drives the L_cf-driven Probe-K gain."
    - "Stage 7 R2 pair-supervised counterfactual remains an option but is lower priority given the F3 finding shape."
    - "PCGrad/GradVac for L_NCE recovery is ALSO available but is now exploratory; the Stage 4-validated R1.8 result stands without L_NCE."


